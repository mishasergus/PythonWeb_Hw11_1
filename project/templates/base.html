<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Parcel Tracker{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'project/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="{% url 'project:home' %}">
                <span class="brand-mark" aria-hidden="true">P</span>
                <span>Parcel<span class="brand-accent">Track</span></span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
            <a href="{% url 'project:home' %}">Home</a>
            <a href="{% url 'project:parcel_list' %}">Parcels</a>
            </nav>
        </div>
    </header>
    <main class="page-content">
        <section class="content-card">
            {% block content %}{% endblock %}
        </section>
    </main>
    <footer class="site-footer">ParcelTrack <span aria-hidden="true">&middot;</span> Simple, reliable parcel tracking</footer>
</body>
</html>
